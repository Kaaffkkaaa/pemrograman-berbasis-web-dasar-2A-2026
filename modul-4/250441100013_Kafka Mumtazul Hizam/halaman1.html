<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="h-screen flex font-aerial">
    <div class="w-1/2 bg-[#5E7AC4] text-white flex flex-col justify-center px-35">
        <h1 class="text-4xl font-bold mb-6 leading-snug">
            Hello Prospective <br> Students
        </h1>
        <img src="UTS/gambar_login page.png" alt="illustration" class="w-120 mb-6">
        <p class="text-sm text-gray-200 max-w-md">
            Unlock your professional potential. Learn from industry leaders
            and stay ahead of the competition.
        </p>
    </div>
    <div id="bg" class="gelap w-1/2 bg-gray-200 flex items-center justify-center">
        <div class="w-[350px]">
            <h2 id="txt" class="text-center text-lg font-semibold mb-1">
                LOGIN PAGE
            </h2>
            <p class="text-center text-xs text-gray-500 mb-6">
                Masukkan Username dan Password Anda
            </p>
            <form class="space-y-4" onsubmit="return validasiLogin()">

                <div>
                    <input type="email" id="email" placeholder="Email Address"
                        class="w-full px-4 py-2 rounded-lg bg-gray-100 text-center border">
                    <small id="emailError" class="text-red-500 text-xs"></small>
                </div>

                <div>
                    <input type="password" id="password" placeholder="Password"
                        class="w-full px-4 py-2 rounded-lg bg-gray-100 text-center border">
                    <small id="passwordError" class="text-red-500 text-xs"></small>
                </div>

                <button class="w-full bg-[#3F57A6] text-white py-2 rounded-lg">
                    Login
                </button>
            </form>
            </form>
            <div class="flex items-center my-6">
                <div class="flex-grow h-px bg-gray-400"></div>
                <span class="mx-3 text-xs text-gray-500">Or Login With</span>
                <div class="flex-grow h-px bg-gray-400"></div>
            </div>
            <button
                class="w-full flex items-center justify-center gap-2 bg-white py-2 rounded-lg shadow hover:bg-gray-50 transition">
                <img src="UTS/ic_google.png" class="w-5">
                <span class="text-sm">Sign in with Account Google</span>
            </button>
            <button id="btnToggle" onclick="toggleDarkMode()" class="mt-5 p-1 rounded-lg w-88 bg-white  shadow hover:bg-gray-50 transition"
                class="px-4 py-2 rounded-full border-2 border-[#3852B4] text-[#3852B4] font-medium text-sm">
                Dark Mode
            </button>
        </div>
    </div>

    <script>
        var isDarkMode = false;
        function toggleDarkMode() {
            isDarkMode = !isDarkMode;
            var tombol = document.getElementById('btnToggle');
            if (isDarkMode) {
                tombol.innerHTML = 'Light Mode';
            } else {
                tombol.innerHTML = 'Dark Mode';
            }
            document.getElementById('bg').style.backgroundColor = isDarkMode ? '#16213e' : '';
            document.getElementById('txt').style.color = isDarkMode ? '#e0e0e0' : '';
        }
        function validasiLogin() {
            var email = document.getElementById("email").value;
            var password = document.getElementById("password").value;
            var emailError = document.getElementById("emailError");
            var passwordError = document.getElementById("passwordError");
            emailError.innerHTML = "";
            passwordError.innerHTML = "";
            if (email == "") {
                emailError.innerHTML = "Email harus diisi";
                return false;
            }
            if (password == "") {
                passwordError.innerHTML = "Password harus diisi";
                return false;
            }
            if (password.length < 6) {
                passwordError.innerHTML = "Minimal 6 karakter";
                return false;
            }
            return true;
        }
    </script>
</body>

</html>
